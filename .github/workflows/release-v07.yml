name: Publish NEST Channel v0.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v07.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated merged main
        uses: actions/checkout@v4
        with:
          ref: c9e6e0782fdcf90e1eb221f264fcc89dde38a0d3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and core tests
        run: npm run check

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK asset
        working-directory: android
        env:
          NEST_GITHUB_CLIENT_ID: ${{ secrets.NEST_GITHUB_CLIENT_ID }}
          NEST_GITHUB_CLIENT_SECRET: ${{ secrets.NEST_GITHUB_CLIENT_SECRET }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare asset and checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NEST-Channel-v0.7.0-debug.apk
          sha256sum NEST-Channel-v0.7.0-debug.apk | tee NEST-Channel-v0.7.0-debug.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.0 \
            NEST-Channel-v0.7.0-debug.apk \
            NEST-Channel-v0.7.0-debug.apk.sha256 \
            --repo '${{ github.repository }}' \
            --target c9e6e0782fdcf90e1eb221f264fcc89dde38a0d3 \
            --title 'NEST Channel v0.7.0 · Security & Sync Core' \
            --notes $'NEST Channel v0.7.0\n\nSecurity & Sync Core release.\n\nHighlights:\n- QR-verified local pairing with Android Keystore identity\n- signed ephemeral ECDH sessions and AES-256-GCM local transport\n- GitHub Authorization Code + PKCE path for registered builds\n- latest-snapshot GitHub bootstrap\n- Lamport logical clocks for deterministic conflict resolution\n- v0.7 Android packaging and CI validation\n\nThe attached APK is debug-signed. GitHub OAuth PKCE is active only in builds supplied with registered OAuth credentials.'
