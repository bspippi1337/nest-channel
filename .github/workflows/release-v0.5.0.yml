name: Publish NEST Channel v0.5.0

on:
  pull_request:
    branches: [main]
    paths:
      - '.release/v0.5.0.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: v0.5.0
      APK_NAME: NEST-Channel-v0.5.0-debug.apk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate v0.5.0 core and security features
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q "versionCode 7" android/app/build.gradle
          grep -q "versionName '0.5.0'" android/app/build.gradle
          node -e "const p=require('./package.json'); if(p.version!=='0.5.0') process.exit(1)"
          grep -q 'AES/GCM/NoPadding' android/app/src/main/java/no/blckswan/nestchannel/LocalSyncManager.java
          grep -q 'KeyAgreement.getInstance("ECDH")' android/app/src/main/java/no/blckswan/nestchannel/LocalSyncManager.java
          grep -q 'BACKOFF_MAX_MS = 60000' github-sync.js
          grep -q 'fieldUpdatedAt' app.js
          grep -q 'nest-core.js' index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unified APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<'NOTES'
          # NEST Channel v0.5.0

          **Secure Local Sync + Resilient Sync**

          v0.5.0 styrker selve fundamentet i NEST Channel: lokaltrafikken er nå kryptert, GitHub-synken tåler feil bedre, og samtidige oppgaveendringer flettes mer presist.

          ## Nytt

          - lokal ECDH P-256 nøkkelutveksling
          - AES-256-GCM for lokale arbeidsdata
          - nulloppsett discovery beholdt
          - valgfri manuell IP-fallback når multicast blokkeres
          - GitHub polling/publisering med eksponentiell backoff, jitter og rate-limit-hensyn
          - request-timeout og trygg retry av mislykkede publiseringer
          - feltvis konfliktfletting for tittel, ansvarlig, status, etiketter og dependencies
          - deterministisk tie-break ved identiske feltklokker
          - automatiske tester av Klar/Venter/Ferdig, sykluser og konflikter
          - felles `nest-core.js` for ren oppgavelogikk

          ## Lokal sikkerhet

          Arbeidsdata sendes ikke lenger i klartekst. Discovery-metadata er fortsatt synlig på lokalnettet. Den automatiske ECDH-håndhilsenen har foreløpig ikke menneskeverifisert peer-identitet, så QR-/kodeverifisert pairing er et naturlig neste steg.

          ## Installasjon

          Last ned APK-en under **Assets** og installer over eksisterende NEST Channel.

          > Dette er fortsatt en debug-signert testutgivelse og er ikke Play Store-signert.
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title 'NEST Channel v0.5.0 · Secure Local + Resilient Sync' \
              --notes-file RELEASE_NOTES.md \
              --latest
            gh release upload "$TAG" "$APK_NAME" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              "$APK_NAME" SHA256SUMS.txt \
              --target main \
              --title 'NEST Channel v0.5.0 · Secure Local + Resilient Sync' \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
