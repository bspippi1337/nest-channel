name: Publish NEST Channel v0.4.1

on:
  pull_request:
    branches: [main]
    paths:
      - '.release/v0.4.1.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: v0.4.1
      APK_NAME: NEST-Channel-v0.4.1-debug.apk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript and GUI fix
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q 'safe-area-inset-top' styles.css
          grep -q 'padding-top: calc(1.35rem' styles.css
          grep -q "versionCode 6" android/app/build.gradle
          grep -q "versionName '0.4.1'" android/app/build.gradle
          node -e "const p=require('./package.json'); if(p.version!=='0.4.1') process.exit(1)"

      - name: Stamp user-facing v0.4.1 metadata
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Versjon 0\.3\.0/Versjon 0.4.1/g; s/Versjon 0\.4\.0/Versjon 0.4.1/g' index.html about.js
          sed -i 's#NEST-Channel/main#NEST-Channel/0.4.1#g; s#NEST-Channel-Android/main#NEST-Channel-Android/0.4.1#g; s#NEST-Channel/0.4.0#NEST-Channel/0.4.1#g; s#NEST-Channel-Android/0.4.0#NEST-Channel-Android/0.4.1#g' android/app/src/main/java/no/blckswan/nestchannel/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unified APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare release files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > SHA256SUMS.txt
          cat > RELEASE_NOTES.md <<'NOTES'
          # NEST Channel v0.4.1

          **GUI-fix for Android, med Dual Sync og den nye NEST-forklaringen samlet i samme APK.**

          ## Nytt i v0.4.1

          - fikser header som kunne gli inn under Android-statuslinjen
          - robust topp-padding med både `safe-area-inset-top` og en eksplisitt minimumsavstand
          - egne paddingverdier for normale, smale og ekstra smale skjermer
          - skjermvennlig tegneserie om betinget oppgavebehandling i Om-seksjonen
          - tegneserien er også lagt inn i README
          - cacheversjonen er løftet slik at oppdatert GUI ikke blir hengende bak gammel CSS
          - GitHub E2EE-synk og lokal nullkonfigurasjonssynk er beholdt

          ## Installasjon

          Last ned APK-en under **Assets** og installer over eksisterende NEST Channel.

          > Dette er fortsatt en debug-signert testutgivelse og er ikke Play Store-signert.
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title 'NEST Channel v0.4.1 · GUI Safe Area Fix' --notes-file RELEASE_NOTES.md --latest
            gh release upload "$TAG" "$APK_NAME" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK_NAME" SHA256SUMS.txt --target main --title 'NEST Channel v0.4.1 · GUI Safe Area Fix' --notes-file RELEASE_NOTES.md --latest
          fi
