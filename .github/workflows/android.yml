name: NEST Channel APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and core tests
        run: npm run check

      - name: Validate v0.7 security invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionCode 9" android/app/build.gradle
          grep -q "versionName '0.7.0'" android/app/build.gradle
          grep -q 'PROTOCOL_VERSION = 3' android/app/src/main/java/no/blckswan/nestchannel/LocalSyncManager.java
          grep -q 'nest_local_identity_v1' android/app/src/main/java/no/blckswan/nestchannel/LocalSyncManager.java
          grep -q 'pair_request' android/app/src/main/java/no/blckswan/nestchannel/LocalSyncManager.java
          grep -q 'startGitHubPkce' android/app/src/main/java/no/blckswan/nestchannel/MainActivity.java
          grep -q 'code_challenge_method=S256' android/app/src/main/java/no/blckswan/nestchannel/MainActivity.java
          grep -q 'fetchLatestSnapshot' github-sync.js
          grep -q 'completeEnvelopeGroups' nest-core.js
          grep -q 'Lamport' README.md

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        env:
          NEST_GITHUB_CLIENT_ID: ${{ secrets.NEST_GITHUB_CLIENT_ID }}
          NEST_GITHUB_CLIENT_SECRET: ${{ secrets.NEST_GITHUB_CLIENT_SECRET }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NEST-Channel-v0.7.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEST-Channel-Unified-APK
          path: NEST-Channel-v0.7.0-debug.apk
          retention-days: 30
          if-no-files-found: error
