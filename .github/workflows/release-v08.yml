name: Publish NEST Channel v0.8.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v08.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated merged main
        uses: actions/checkout@v4
        with:
          ref: 46dc49143df0e24dc26386434b460498bd2c35c1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and core tests
        run: npm run check

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK asset
        working-directory: android
        env:
          NEST_GITHUB_CLIENT_ID: ${{ secrets.NEST_GITHUB_CLIENT_ID }}
          NEST_GITHUB_CLIENT_SECRET: ${{ secrets.NEST_GITHUB_CLIENT_SECRET }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare asset and checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NEST-Channel-v0.8.0-debug.apk
          sha256sum NEST-Channel-v0.8.0-debug.apk | tee NEST-Channel-v0.8.0-debug.apk.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.8.0 \
            NEST-Channel-v0.8.0-debug.apk \
            NEST-Channel-v0.8.0-debug.apk.sha256 \
            --repo '${{ github.repository }}' \
            --target 46dc49143df0e24dc26386434b460498bd2c35c1 \
            --title 'NEST Channel v0.8.0 · Zero-Setup' \
            --notes $'NEST Channel v0.8.0\n\nZero-Setup release.\n\nHighlights:\n- first-run novice-friendly wizard with one task per screen\n- guided GitHub signup without CAPTCHA bypass\n- official pre-filled fine-grained token setup for open/debug builds\n- automatic private NEST repo creation\n- automatic encrypted channel wiring and reconnect\n- one-tap local-only path\n- PKCE-aware path for registered builds\n- existing v0.7 secure local pairing, latest-snapshot bootstrap and Lamport clocks retained\n\nThe attached APK is debug-signed. GitHub OAuth PKCE is active only in builds supplied with registered OAuth credentials.'
