name: Import NEST Channel Source

on:
  pull_request:
    paths:
      - 'bootstrap/source.b64.*'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Detect source bundle
        id: source
        shell: bash
        run: |
          if compgen -G 'bootstrap/source.b64.*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Import complete source tree
        if: steps.source.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.b64.* | base64 --decode | tar -xzf -
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Publish imported source to PR branch
        if: steps.source.outputs.present == 'true'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish NEST Channel v0.3.0 with GitHub OAuth sync'
          git push origin HEAD:"$HEAD_BRANCH"
