name: Import NEST Channel Source

on:
  pull_request:
    paths:
      - 'NEST-Channel-v0.3.0-GitHub-Sync-Source.zip'
      - 'bootstrap/run-import.txt'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nest-source-import-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Unpack complete source tree
        shell: bash
        run: |
          set -euo pipefail
          ZIP='NEST-Channel-v0.3.0-GitHub-Sync-Source.zip'
          test -f "$ZIP"

          rm -rf /tmp/nest-channel-source
          mkdir -p /tmp/nest-channel-source
          unzip -q "$ZIP" -d /tmp/nest-channel-source

          rsync -a --delete \
            --exclude='.git/' \
            --exclude="$ZIP" \
            /tmp/nest-channel-source/ ./

          rm -f "$ZIP"
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Publish source to import branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Publish NEST Channel v0.3.0 with GitHub sync'
          git push origin HEAD:"$HEAD_BRANCH"
