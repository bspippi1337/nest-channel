name: NEST 0.9 Signed Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag/version
        required: true
        default: v0.9.0
        type: string
      publish:
        description: Publish/update GitHub Release after verification
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and core tests
        run: npm run check

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.NEST_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NEST_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEST_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEST_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ secrets.NEST_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT; do
            test -n "${!name:-}" || { echo "Missing release secret: $name" >&2; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nest-app-signing-v1.p12"
          chmod 600 "$RUNNER_TEMP/nest-app-signing-v1.p12"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed APK and AAB
        working-directory: android
        env:
          NEST_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/nest-app-signing-v1.p12
          NEST_RELEASE_STORE_PASSWORD: ${{ secrets.NEST_RELEASE_STORE_PASSWORD }}
          NEST_RELEASE_KEY_ALIAS: ${{ secrets.NEST_RELEASE_KEY_ALIAS }}
          NEST_RELEASE_KEY_PASSWORD: ${{ secrets.NEST_RELEASE_KEY_PASSWORD }}
          NEST_GITHUB_CLIENT_ID: ${{ secrets.NEST_GITHUB_CLIENT_ID }}
          NEST_GITHUB_CLIENT_SECRET: ${{ secrets.NEST_GITHUB_CLIENT_SECRET }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify signing identity
        env:
          EXPECTED_CERT: ${{ secrets.NEST_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          test -s "$AAB"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          # AABs use JAR signing. A self-signed release certificate is expected here;
          # jarsigner --strict returns warning bit 4 for that even when the signature is valid.
          jarsigner -verify "$AAB" >/dev/null

          APK_ACTUAL="$($APKSIGNER verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/{print $2; exit}' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          AAB_ACTUAL="$(keytool -J-Duser.language=en -printcert -jarfile "$AAB" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"

          test -n "$APK_ACTUAL"
          test -n "$AAB_ACTUAL"
          test -n "$EXPECTED"

          if [ "$APK_ACTUAL" != "$EXPECTED" ]; then
            echo "APK signing certificate mismatch" >&2
            echo "Expected: $EXPECTED" >&2
            echo "Actual:   $APK_ACTUAL" >&2
            exit 1
          fi

          if [ "$AAB_ACTUAL" != "$EXPECTED" ]; then
            echo "AAB signing certificate mismatch" >&2
            echo "Expected: $EXPECTED" >&2
            echo "Actual:   $AAB_ACTUAL" >&2
            exit 1
          fi

          printf '%s\n' "$APK_ACTUAL" > NEST-Channel-v0.9.0-cert-sha256.txt

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          SAFE_VERSION="${VERSION#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "NEST-Channel-${SAFE_VERSION}-release.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "NEST-Channel-${SAFE_VERSION}-release.aab"
          sha256sum "NEST-Channel-${SAFE_VERSION}-release.apk" "NEST-Channel-${SAFE_VERSION}-release.aab" | tee "NEST-Channel-${SAFE_VERSION}-SHA256SUMS.txt"
          mv NEST-Channel-v0.9.0-cert-sha256.txt "NEST-Channel-${SAFE_VERSION}-cert-sha256.txt"

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEST-Channel-v0.9.0-SIGNED
          path: |
            NEST-Channel-*-release.apk
            NEST-Channel-*-release.aab
            NEST-Channel-*-SHA256SUMS.txt
            NEST-Channel-*-cert-sha256.txt
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          SAFE_VERSION="${VERSION#v}"
          NOTES=$'NEST Channel v0.9 signed limited beta\n\n- Android API 36\n- production app-signing identity v1\n- signed APK for limited distribution (up to 20 registered devices)\n- signed AAB retained for migration/testing\n- v1.0 is reserved for full Google Play distribution\n\nThe signing certificate fingerprint and SHA-256 checksums are attached.'
          if gh release view "$VERSION" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              "NEST-Channel-${SAFE_VERSION}-release.apk" \
              "NEST-Channel-${SAFE_VERSION}-release.aab" \
              "NEST-Channel-${SAFE_VERSION}-SHA256SUMS.txt" \
              "NEST-Channel-${SAFE_VERSION}-cert-sha256.txt" \
              --repo '${{ github.repository }}' --clobber
            gh release edit "$VERSION" --repo '${{ github.repository }}' --title "NEST Channel ${VERSION} · Signed Limited Beta" --notes "$NOTES"
          else
            gh release create "$VERSION" \
              "NEST-Channel-${SAFE_VERSION}-release.apk" \
              "NEST-Channel-${SAFE_VERSION}-release.aab" \
              "NEST-Channel-${SAFE_VERSION}-SHA256SUMS.txt" \
              "NEST-Channel-${SAFE_VERSION}-cert-sha256.txt" \
              --repo '${{ github.repository }}' \
              --target '${{ github.sha }}' \
              --title "NEST Channel ${VERSION} · Signed Limited Beta" \
              --notes "$NOTES"
          fi
