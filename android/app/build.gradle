plugins {
    id 'com.android.application'
}

def githubClientId = System.getenv('NEST_GITHUB_CLIENT_ID') ?: ''
def githubClientSecret = System.getenv('NEST_GITHUB_CLIENT_SECRET') ?: ''
def releaseStorePath = System.getenv('NEST_RELEASE_KEYSTORE_PATH') ?: ''
def releaseStorePassword = System.getenv('NEST_RELEASE_STORE_PASSWORD') ?: ''
def releaseKeyAlias = System.getenv('NEST_RELEASE_KEY_ALIAS') ?: ''
def releaseKeyPassword = System.getenv('NEST_RELEASE_KEY_PASSWORD') ?: ''
def releaseSigningReady = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

def javaString = { String value ->
    '"' + (value ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'no.blckswan.nestchannel'
    compileSdk 36

    defaultConfig {
        applicationId 'no.blckswan.nestchannel'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '0.9.0'
        buildConfigField 'String', 'NEST_GITHUB_CLIENT_ID', javaString(githubClientId)
        buildConfigField 'String', 'NEST_GITHUB_CLIENT_SECRET', javaString(githubClientSecret)
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def syncWebAssets = tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'storage-sandbox.js', 'nest-core.js', 'app.js', 'styles.css', 'manifest.webmanifest',
                'icon.svg', 'nest-channel-comic.webp', 'service-worker.js', 'github-sync.js', 'github-sync.css',
                'about.js', 'about.css', 'ux-v06.js', 'ux-v06.css', 'security-v07.js', 'security-v07.css',
                'onboarding-v08.js', 'onboarding-v08.css', 'release-v09.js'
    }
    into(layout.projectDirectory.dir('src/main/assets'))
}

tasks.named('preBuild').configure {
    dependsOn(syncWebAssets)
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
