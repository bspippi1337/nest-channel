plugins {
    id 'com.android.application'
}

def githubClientId = System.getenv('NEST_GITHUB_CLIENT_ID') ?: ''
def githubClientSecret = System.getenv('NEST_GITHUB_CLIENT_SECRET') ?: ''
def releaseStorePath = System.getenv('NEST_RELEASE_KEYSTORE_PATH') ?: ''
def releaseStorePassword = System.getenv('NEST_RELEASE_STORE_PASSWORD') ?: ''
def releaseKeyAlias = System.getenv('NEST_RELEASE_KEY_ALIAS') ?: ''
def releaseKeyPassword = System.getenv('NEST_RELEASE_KEY_PASSWORD') ?: ''
def releaseSigningReady = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

def javaString = { String value ->
    '"' + (value ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'no.blckswan.nestchannel'
    compileSdk 36

    defaultConfig {
        applicationId 'no.blckswan.nestchannel'
        minSdk 26
        targetSdk 36
        versionCode 15
        versionName '0.9.3'
        buildConfigField 'String', 'NEST_GITHUB_CLIENT_ID', javaString(githubClientId)
        buildConfigField 'String', 'NEST_GITHUB_CLIENT_SECRET', javaString(githubClientSecret)
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            // Isolated screencast/test install. Never share app data with signed NEST.
            applicationIdSuffix '.demo'
            versionNameSuffix '-capture'
            buildConfigField 'boolean', 'NEST_CAPTURE_DEMO', 'true'
        }
        release {
            // Production builds retain Android screenshot/recording protection.
            buildConfigField 'boolean', 'NEST_CAPTURE_DEMO', 'false'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def syncWebAssets = tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'storage-sandbox.js', 'nest-core.js', 'app.js', 'styles.css', 'manifest.webmanifest',
                'icon.svg', 'nest-channel-comic.webp', 'nest-orbit.svg', 'nest-flow.svg', 'nest-empty.svg', 'nest-comic-about.svg', 'nest-comic-repo.svg', 'nest-comic-qr.svg', 'nest-comic-verify.svg',
                'art-direction.css', 'service-worker.js', 'high-threat.js', 'github-fs.js', 'github-sync.js', 'github-sync.css',
                'about.js', 'about.css', 'ux-v06.js', 'ux-v06.css', 'security-v07.js', 'security-v07.css',
                'release-v09.js',
                 'nest-wizard-v091.js', 'nest-wizard-v091.css', 'nest-ptt-v091.js', 'nest-ptt-v091.css'
    }
    into(layout.projectDirectory.dir('src/main/assets'))
}

tasks.named('preBuild').configure {
    dependsOn(syncWebAssets)
}

dependencies {
    // Required for WindowCompat / WindowInsetsCompat on Android 15 and 16.
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
