plugins {
    id 'com.android.application'
}

def githubClientId = System.getenv('NEST_GITHUB_CLIENT_ID') ?: ''
def githubClientSecret = System.getenv('NEST_GITHUB_CLIENT_SECRET') ?: ''

def javaString = { String value ->
    '"' + (value ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'no.blckswan.nestchannel'
    compileSdk 35

    defaultConfig {
        applicationId 'no.blckswan.nestchannel'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.7.0'
        buildConfigField 'String', 'NEST_GITHUB_CLIENT_ID', javaString(githubClientId)
        buildConfigField 'String', 'NEST_GITHUB_CLIENT_SECRET', javaString(githubClientSecret)
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def syncWebAssets = tasks.register('syncWebAssets', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'storage-sandbox.js', 'nest-core.js', 'app.js', 'styles.css', 'manifest.webmanifest',
                'icon.svg', 'nest-channel-comic.webp', 'service-worker.js', 'github-sync.js', 'github-sync.css',
                'about.js', 'about.css', 'ux-v06.js', 'ux-v06.css', 'security-v07.js', 'security-v07.css'
    }
    into(layout.projectDirectory.dir('src/main/assets'))
}

tasks.named('preBuild').configure {
    dependsOn(syncWebAssets)
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
