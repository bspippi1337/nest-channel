<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img"><title>QR kode mellom to mobiler, illustrert med en skannelinje</title><style>.hand{stroke:#e4efdb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.mint{stroke:#acebc7;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.gold{stroke:#d6b489;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.dim{stroke:#83a89a;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.bg{fill:#0e281f}.fill{fill:#e4efdb}@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;transform:none!important;stroke-dashoffset:0!important;opacity:1!important}}</style><style>.scan{animation:sweep 1.9s ease-in-out 2 alternate both}@keyframes sweep{from{transform:translateY(-45px);opacity:.45}to{transform:translateY(50px);opacity:1}}</style><rect x="94" y="27" width="108" height="202" rx="17" class="bg" stroke="#e4efdb" stroke-width="3"/><rect x="107" y="46" width="82" height="161" class="dim"/><path class="hand" d="M120 60h24v24h-24zm45 0h18v18h-18zM120 104h24v24h-24zm45 0h18v18h-18zM120 152h24v24h-24zm45 0h18v18h-18z"/><path class="gold" d="M239 134Q326 63 404 134M392 121l13 14-15 11" stroke-dasharray="6 10"/><rect x="442" y="27" width="108" height="202" rx="17" class="bg" stroke="#e4efdb" stroke-width="3"/><rect x="455" y="46" width="82" height="161" class="dim"/><g class="scan"><path class="mint" d="M460 117h72"/><path class="dim" d="M460 108v16m72-16v16"/></g><path class="gold" d="M470 167l15 15 34-40"/></svg>